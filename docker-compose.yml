version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: famed_estagio_db
    restart: always
    environment:
      POSTGRES_DB: famed_estagios
      POSTGRES_USER: famed_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-famed_secret_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - famed_net

  web:
    build: .
    container_name: famed_estagio_web
    restart: always
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DATABASE_URL=postgres://famed_user:${DB_PASSWORD:-famed_secret_2026}@db:5432/famed_estagios
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-famed_production_secret_key_ufpa_2026}
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - famed_net

volumes:
  pgdata:
  static_volume:
  media_volume:

networks:
  famed_net:
    driver: bridge
